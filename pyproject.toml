[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docqa"
version = "0.1.0"
description = "Question answering over the FastAPI docs, with hybrid search, reranking and citations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.0",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "langchain-core>=1.0",
    "langchain-groq>=1.0",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
docqa = "docqa.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docqa"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "S"]
ignore = ["S101", "S104", "S603", "S607", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "S324"]
"eval/*" = ["E402", "E501"]
